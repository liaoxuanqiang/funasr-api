# This workflow starts the FunASR (OpenAI-compatible) API server
# and verifies it can be started, load the paraformer-zh model, and becomes ready.

name: FunASR API Deploy Test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U funasr torch torchaudio modelscope
          # Extra packages required by the funasr-server (OpenAI-compatible) entrypoint.
          pip install uvicorn fastapi python-multipart
          echo "FunASR version:"
          python -c "import funasr; print(funasr.__version__)"

      - name: Start FunASR server (paraformer-zh)
        run: |
          # Start the OpenAI-compatible funasr-server in the background.
          # The paraformer-zh model (with VAD and punctuation) is preloaded at
          # startup and downloaded on first launch if not cached. CPU is used
          # because GitHub-hosted runners have no GPU.
          nohup python -m funasr.bin.server \
            --host 127.0.0.1 \
            --port 10095 \
            --device cpu \
            --model paraformer \
            > funasr.log 2>&1 &

          echo "FunASR server PID: $!"

      - name: Wait for FunASR server readiness
        run: |
          # The server binds the port only after the paraformer-zh model has been
          # preloaded, so /health returning ok with "paraformer" loaded confirms
          # both server startup and model readiness.
          for i in $(seq 1 150); do
            body=$(curl -sf http://127.0.0.1:10095/health 2>/dev/null || true)
            if [ -n "$body" ]; then
              echo "FunASR server health: $body"
              if echo "$body" | grep -q '"paraformer"'; then
                echo "FunASR server is ready and paraformer-zh model is loaded"
                exit 0
              fi
            fi
            echo "Waiting for FunASR server (paraformer-zh) to start... ($i/150)"
            sleep 4
          done
          echo "FunASR server did not become ready in time."
          tail -200 funasr.log
          exit 1
