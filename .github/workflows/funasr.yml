name: FunASR API Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: funasr-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      # Caddy PWA gateway port (the Cloudflare Tunnel origin must match this).
      SERVER_PORT: "80"
      # Internal FunASR ASR server port (behind the Caddy gateway).
      ASR_PORT: "8080"
      SERVER_HEALTH_URL: "http://127.0.0.1:80/health"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('*.txt', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U funasr torch torchaudio modelscope
          pip install uvicorn fastapi python-multipart
          echo "FunASR version:"
          python -c "import funasr; print(funasr.__version__)"
          # ffmpeg is required to decode webm/opus recordings from the PWA's
          # MediaRecorder (soundfile alone cannot).  The runner image usually
          # ships it; install quietly if absent.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Start ASR server (custom wrapper over FunASR paraformer-zh) and wait for readiness
        run: |
          # Run our own thin FastAPI server (asr_server.py) instead of
          # `python -m funasr.bin.server`, which crashes with HTTP 500
          # (IndexError: list index out of range) whenever the ASR model returns
          # an empty result list (silence / too-short / undecodable audio).
          # The wrapper returns a graceful 200 with empty text instead.
          cd "$GITHUB_WORKSPACE"
          nohup python -m uvicorn asr_server:app \
            --host 127.0.0.1 \
            --port "$ASR_PORT" \
            --log-level info \
            > funasr.log 2>&1 &
          SERVER_PID=$!
          echo "ASR server PID: $SERVER_PID (port $ASR_PORT)"
          echo "Waiting for the ASR model to download/load (first deploy can take several minutes)..."
          for i in $(seq 1 360); do
            # --max-time so a connecting-but-not-yet-accepting server can't hang
            # the readiness poll; it just fails and we keep waiting.
            body=$(curl -sf --max-time 10 http://127.0.0.1:$ASR_PORT/health 2>/dev/null || true)
            if [ -n "$body" ]; then
              echo "ASR server health: $body"
              if echo "$body" | grep -qE '"(model|server|status|ready)"|"paraformer"'; then
                echo "ASR server is ready"
                exit 0
              fi
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "ASR server process ($SERVER_PID) exited early."
              break
            fi
            echo "Waiting for ASR server to start... ($i/360)"
            sleep 5
          done
          echo "ASR server did not become ready in time."
          echo "===== tail -200 funasr.log ====="
          tail -200 funasr.log
          exit 1

      - name: Install Caddy
        run: |
          CADDY_VERSION="v2.11.4"
          echo "Downloading Caddy ${CADDY_VERSION} from GitHub Releases"
          curl -fsSL --retry 3 --retry-all-errors -o caddy.tar.gz \
            "https://github.com/caddyserver/caddy/releases/download/${CADDY_VERSION}/caddy_${CADDY_VERSION#v}_linux_amd64.tar.gz"
          echo "Downloaded:"
          ls -l caddy.tar.gz
          # Sanity check: fail early with a clear message if the download is not gzip.
          if ! gzip -t caddy.tar.gz; then
            echo "ERROR: downloaded file is not a valid gzip archive."
            echo "----- first 400 bytes -----"
            head -c 400 caddy.tar.gz || true
            exit 1
          fi
          tar -xzf caddy.tar.gz
          sudo mv caddy /usr/local/bin/
          echo "Caddy version:"
          caddy version

      - name: Start PWA gateway (Caddy) and verify
        run: |
          # Port 80 is a privileged port (<1024); the runner user cannot bind to
          # it directly, so Caddy must run via sudo (required to bind to :80).
          # Caddyfile uses a RELATIVE root (./pwa), so we cd into the workspace
          # first; the daemonized process keeps that working directory.
          # "caddy start" daemonizes Caddy, then we wait for it to be reachable.
          echo "Starting Caddy gateway on port $SERVER_PORT (via sudo for privileged port)..."
          cd "$GITHUB_WORKSPACE"
          sudo nohup caddy start --config Caddyfile --adapter caddyfile > caddy.log 2>&1
          START_EXIT=$?
          echo "caddy start exit code: $START_EXIT"
          echo "===== caddy.log ====="
          cat caddy.log
          echo "===== /usr/local/bin/caddy perms ====="
          ls -l /usr/local/bin/caddy || true
          # Diagnostic: confirm the working directory and PWA root that Caddy uses.
          echo "===== workspace & pwa root diagnostics ====="
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          if [ -d "${GITHUB_WORKSPACE}/pwa" ]; then
            echo "OK: ${GITHUB_WORKSPACE}/pwa exists"
            ls -la "${GITHUB_WORKSPACE}/pwa" | head -n 12
          else
            echo "ERROR: ${GITHUB_WORKSPACE}/pwa does not exist"
          fi
          # Abort fast if Caddy failed to start (e.g. bind permission denied on :80).
          if [ "$START_EXIT" -ne 0 ] || ! pgrep -x caddy >/dev/null 2>&1; then
            echo "ERROR: Caddy failed to start on port $SERVER_PORT."
            echo "===== tail -200 caddy.log ====="
            tail -200 caddy.log
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:$SERVER_PORT/"; then
              echo "PWA is being served at http://127.0.0.1:$SERVER_PORT/ ($i/30)"
              break
            fi
            echo "Waiting for PWA gateway to start... ($i/30)"
            sleep 2
          done
          echo "===== PWA sanity checks ====="
          curl -fsS "http://127.0.0.1:$SERVER_PORT/" | grep -Eo '<title>[^<]+</title>' || true
          curl -fsS -o /dev/null -w "manifest.webmanifest -> %{http_code} %{content_type}\n" \
            "http://127.0.0.1:$SERVER_PORT/manifest.webmanifest"
          curl -fsS -o /dev/null -w "icon-512.png        -> %{http_code} %{content_type}\n" \
            "http://127.0.0.1:$SERVER_PORT/icons/icon-512.png"
          curl -fsS -o /dev/null -w "service worker      -> %{http_code} %{content_type}\n" \
            "http://127.0.0.1:$SERVER_PORT/sw.js"
          body=$(curl -sf "http://127.0.0.1:$SERVER_PORT/health" 2>/dev/null || true)
          echo "proxied /health -> $body"
          if [ -z "$body" ] || ! echo "$body" | grep -qE '"(model|server|status|ready)"|"paraformer"'; then
            echo "ERROR: gateway did not proxy /health to the FunASR backend."
            echo "===== tail -100 caddy.log ====="
            tail -100 caddy.log
            echo "===== tail -100 funasr.log ====="
            tail -100 funasr.log
            exit 1
          fi
          # Since "caddy start" daemonized Caddy, verify it is still alive and
          # serving after the readiness loop by checking the process list.
          if ! pgrep -x caddy >/dev/null 2>&1; then
            echo "ERROR: Caddy process exited early."
            echo "===== tail -100 caddy.log ====="
            tail -100 caddy.log
            exit 1
          fi
          echo "PWA gateway is ready."

      - name: Smoke-test transcription API
        run: |
          # Download a REAL Chinese speech sample (FunASR's official example
          # audio) and POST it to /v1/audio/transcriptions to verify the
          # end-to-end ASR pipeline (gateway -> FunASR backend).
          #
          # IMPORTANT: a synthetic tone is NOT valid here - when the audio
          # contains no speech, FunASR returns an empty result list and its
          # server crashes with "IndexError: list index out of range" in
          # _process_fallback -> HTTP 500.  Using real speech exercises the
          # actual pipeline and surfaces any HTTP 500 from the ASR server during
          # deployment, with funasr.log printed for diagnosis.
          curl -fsSL --retry 3 --retry-all-errors -o smoke.wav \
            "https://isv-data.oss-cn-hangzhou.aliyuncs.com/ics/MaaS/ASR/test_audio/asr_example_zh.wav"
          echo "downloaded smoke.wav:"
          ls -l smoke.wav
          echo "===== POST /v1/audio/transcriptions ====="
          # --max-time guards against an indefinite hang (e.g. if the ASR
          # backend is still warming up); fail cleanly instead of blocking the
          # whole run until it is cancelled.
          resp=$(curl -sS --max-time 600 -w "\nHTTP_STATUS:%{http_code}" \
            -F "file=@smoke.wav;type=audio/wav" \
            -F "model=paraformer" \
            "http://127.0.0.1:$SERVER_PORT/v1/audio/transcriptions" 2>&1)
          echo "$resp"
          status=$(echo "$resp" | grep -o 'HTTP_STATUS:.*' | cut -d: -f2)
          if [ "$status" = "200" ]; then
            echo "SMOKE TEST PASSED: /v1/audio/transcriptions returned 200"
          else
            echo "ERROR: transcription smoke test failed (HTTP $status)."
            echo "===== tail -200 funasr.log ====="
            tail -200 funasr.log || true
            echo "===== tail -100 caddy.log ====="
            tail -100 caddy.log || true
            exit 1
          fi
          # Confirms the ASR actually recognized speech (not just a 200 from an
          # empty result).  The OpenAI-compatible endpoint returns JSON with a
          # non-empty "text" field for real speech.
          if ! echo "$resp" | grep -q '"text"' || echo "$resp" | grep -q '"text":"[[:space:]]*"'; then
            echo "ERROR: smoke test returned 200 but no recognized text."
            echo "===== tail -200 funasr.log ====="
            tail -200 funasr.log || true
            exit 1
          fi
          echo "SMOKE TEST PASSED: recognized non-empty text."

      - name: Install cloudflared
        run: |
          curl -sL -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y
          echo "cloudflared version:"
          cloudflared --version
      - name: Start cloudflared tunnel
        run: |
          nohup cloudflared tunnel run \
            --token "${{ secrets.CLOUDFLARE_TUNNEL_TOKEN || 'eyJhIjoiNDc0OGFmNGJjMGMyODI4ZjEyOTdhZjJkYmI4M2ZkYTMiLCJ0IjoiYjQxZWYzOGYtZTJiMS00MjQ0LTg2ZDUtNWViZGY1MjdmOTAzIiwicyI6Ik5tVTJORFptWXpBdFpURXpOUzAwWW1GaUxUZzBabUl0TlRZM01HSXdPR05oTjJVeCJ9' }}" \
            > cloudflared.log 2>&1 &
          CF_PID=$!
          echo "cloudflared tunnel PID: $CF_PID"
          sleep 10
          echo "===== tail -50 cloudflared.log ====="
          tail -50 cloudflared.log
          if ! kill -0 "$CF_PID" 2>/dev/null; then
            echo "cloudflared tunnel process exited early."
            exit 1
          fi
          echo "cloudflared tunnel is running."
      - name: Keep runner alive (maintain FunASR server + PWA gateway)
        run: |
          echo "FunASR server + PWA gateway are ready; keeping runner alive to keep them running."
          while true; do
            sleep 60
          done
