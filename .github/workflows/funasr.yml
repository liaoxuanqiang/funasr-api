name: FunASR API Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 3600
    env:
      SERVER_PORT: "10095"
      SERVER_HEALTH_URL: "http://127.0.0.1:10095/health"
      TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
      TS_API_TOKEN: ${{ secrets.TS_API_TOKEN }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U funasr torch torchaudio modelscope
          pip install uvicorn fastapi python-multipart
          echo "FunASR version:"
          python -c "import funasr; print(funasr.__version__)"

      - name: Start FunASR server (paraformer-zh) and wait for readiness
        run: |
          nohup python -m funasr.bin.server \
            --host 127.0.0.1 \
            --port 10095 \
            --device cpu \
            --model paraformer \
            --hub hf \
            > funasr.log 2>&1 &
          SERVER_PID=$!
          echo "FunASR server PID: $SERVER_PID"

          for i in $(seq 1 600); do
            body=$(curl -sf http://127.0.0.1:10095/health 2>/dev/null || true)
            if [ -n "$body" ]; then
              echo "FunASR server health: $body"
              if echo "$body" | grep -q '"paraformer"'; then
                echo "FunASR server is ready and paraformer-zh model is loaded"
                exit 0
              fi
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "FunASR server process ($SERVER_PID) exited early."
              break
            fi
            echo "Waiting for FunASR server (paraformer-zh) to start... ($i/600)"
            sleep 5
          done
          echo "FunASR server did not become ready in time."
          echo "===== tail -200 funasr.log ====="
          tail -200 funasr.log
          exit 1

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "Tailscale version:"
          tailscale version

      - name: Start tailscaled, authenticate and enable Tailscale SSH
        run: |
          sudo nohup tailscaled \
            --state=/var/lib/tailscale/tailscaled.state \
            --socket=/var/run/tailscale/tailscaled.sock \
            > /var/log/tailscaled.log 2>&1 &
          sleep 3
          sudo tailscale up \
            --authkey "$TS_AUTH_KEY" \
            --ssh \
            --hostname funasr-runner
          echo "===== Tailscale status ====="
          tailscale status
          echo "API access token is available for Tailscale Admin API calls:"
          echo "TS_API_TOKEN=$TS_API_TOKEN"

      - name: Keep runner alive (maintain FunASR server)
        run: |
          echo "FunASR server is ready; keeping runner alive to keep the server running."
          while true; do
            sleep 60
          done

