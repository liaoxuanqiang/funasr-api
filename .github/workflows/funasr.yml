name: FunASR API Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: funasr-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      # Caddy PWA gateway port (the Cloudflare Tunnel origin is fixed by the
      # dashboard-managed remote config to http://localhost:10095).
      SERVER_PORT: "10095"
      # Internal FunASR ASR server port (behind the Caddy gateway).
      ASR_PORT: "10097"
      SERVER_HEALTH_URL: "http://127.0.0.1:10095/health"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('*.txt', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U funasr torch torchaudio modelscope
          pip install uvicorn fastapi python-multipart
          echo "FunASR version:"
          python -c "import funasr; print(funasr.__version__)"
      - name: Start FunASR server (paraformer-zh) and wait for readiness
        run: |
          nohup python -m funasr.bin.server \
            --host 127.0.0.1 \
            --port $ASR_PORT \
            --device cpu \
            --model paraformer \
            --hub hf \
            > funasr.log 2>&1 &
          SERVER_PID=$!
          echo "FunASR server PID: $SERVER_PID (port $ASR_PORT)"
          for i in $(seq 1 60); do
            body=$(curl -sf http://127.0.0.1:$ASR_PORT/health 2>/dev/null || true)
            if [ -n "$body" ]; then
              echo "FunASR server health: $body"
              if echo "$body" | grep -qE '"(model|server|status|ready)"|"paraformer"'; then
                echo "FunASR server is ready and model is loaded"
                exit 0
              fi
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "FunASR server process ($SERVER_PID) exited early."
              break
            fi
            echo "Waiting for FunASR server (paraformer-zh) to start... ($i/60)"
            sleep 5
          done
          echo "FunASR server did not become ready in time."
          echo "===== tail -200 funasr.log ====="
          tail -200 funasr.log
          exit 1

      - name: Install Caddy
        run: |
          curl -fsSL -o caddy.tar.gz \
            "https://caddyserver.com/api/download?os=linux&arch=amd64"
          tar -xzf caddy.tar.gz
          sudo mv caddy /usr/local/bin/
          echo "Caddy version:"
          caddy version

      - name: Start PWA gateway (Caddy) and verify
        run: |
          nohup caddy run --config Caddyfile > caddy.log 2>&1 &
          CADDY_PID=$!
          echo "Caddy PWA gateway PID: $CADDY_PID (port $SERVER_PORT)"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:$SERVER_PORT/"; then
              echo "PWA is being served at http://127.0.0.1:$SERVER_PORT/ ($i/30)"
              break
            fi
            if ! kill -0 "$CADDY_PID" 2>/dev/null; then
              echo "Caddy process exited early."
              break
            fi
            echo "Waiting for PWA gateway to start... ($i/30)"
            sleep 2
          done
          echo "===== PWA sanity checks ====="
          curl -fsS "http://127.0.0.1:$SERVER_PORT/" | grep -Eo '<title>[^<]+</title>' || true
          curl -fsS -o /dev/null -w "manifest.webmanifest -> %{http_code} %{content_type}\n" \
            "http://127.0.0.1:$SERVER_PORT/manifest.webmanifest"
          curl -fsS -o /dev/null -w "icon-512.png        -> %{http_code} %{content_type}\n" \
            "http://127.0.0.1:$SERVER_PORT/icons/icon-512.png"
          curl -fsS -o /dev/null -w "service worker      -> %{http_code} %{content_type}\n" \
            "http://127.0.0.1:$SERVER_PORT/sw.js"
          body=$(curl -sf "http://127.0.0.1:$SERVER_PORT/health" 2>/dev/null || true)
          echo "proxied /health -> $body"
          if [ -z "$body" ] || ! echo "$body" | grep -qE '"(model|server|status|ready)"|"paraformer"'; then
            echo "ERROR: gateway did not proxy /health to the FunASR backend."
            echo "===== tail -100 caddy.log ====="
            tail -100 caddy.log
            echo "===== tail -100 funasr.log ====="
            tail -100 funasr.log
            exit 1
          fi
          if ! kill -0 "$CADDY_PID" 2>/dev/null; then
            echo "ERROR: Caddy process exited early."
            echo "===== tail -100 caddy.log ====="
            tail -100 caddy.log
            exit 1
          fi
          echo "PWA gateway is ready."

      - name: Install cloudflared
        run: |
          curl -sL -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y
          echo "cloudflared version:"
          cloudflared --version
      - name: Start cloudflared tunnel
        run: |
          nohup cloudflared tunnel run \
            --token "${{ secrets.CLOUDFLARE_TUNNEL_TOKEN || 'eyJhIjoiNDc0OGFmNGJjMGMyODI4ZjEyOTdhZjJkYmI4M2ZkYTMiLCJ0IjoiYjQxZWYzOGYtZTJiMS00MjQ0LTg2ZDUtNWViZGY1MjdmOTAzIiwicyI6Ik5tVTJORFptWXpBdFpURXpOUzAwWW1GaUxUZzBabUl0TlRZM01HSXdPR05oTjJVeCJ9' }}" \
            > cloudflared.log 2>&1 &
          CF_PID=$!
          echo "cloudflared tunnel PID: $CF_PID"
          sleep 10
          echo "===== tail -50 cloudflared.log ====="
          tail -50 cloudflared.log
          if ! kill -0 "$CF_PID" 2>/dev/null; then
            echo "cloudflared tunnel process exited early."
            exit 1
          fi
          echo "cloudflared tunnel is running."
      - name: Keep runner alive (maintain FunASR server + PWA gateway)
        run: |
          echo "FunASR server + PWA gateway are ready; keeping runner alive to keep them running."
          while true; do
            sleep 60
          done
