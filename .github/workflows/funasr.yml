# This workflow starts the FunASR offline HTTP API server
# and verifies it can be started, load the paraformer-zh model, and becomes ready.

name: FunASR API Deploy Test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      FunASR_MODEL_DIR: /tmp/funasr-models
      FunASR_PORTS: 10095
      FunASR_BRD_PORT: 10096
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U funasr torch torchaudio modelscope
          echo "FunASR version:"
          python -c "import funasr; print(funasr.__version__)"

      - name: Start FunASR offline server (paraformer-zh)
        env:
          FUNASR_DEBUG: "1"
        run: |
          # Start the offline HTTP server in the background, downloading the
          # paraformer-zh model on first launch if not cached.
          nohup python -m funasr.server \
            --host 127.0.0.1 \
            --port 10095 \
            --backend-model "paraformer-zh:asr" \
            > funasr.log 2>&1 &

          echo "FunASR server PID: $!"

      - name: Wait for FunASR server readiness
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:10095/healthcheck > /dev/null 2>&1; then
              echo "FunASR server is ready"
              exit 0
            fi
            echo "Waiting for FunASR server to start... ($i/90)"
            sleep 4
          done
          echo "FunASR server did not become ready in time."
          tail -200 funasr.log
          exit 1
