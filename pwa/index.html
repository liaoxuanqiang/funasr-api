<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="description" content="FunASR 中文语音识别：上传或录制音频，即刻获得文字转写。" />
  <title>FunASR 语音识别</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />

  <!-- iOS standalone support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FunASR" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-icon" src="icons/icon-192.png" alt="FunASR" width="40" height="40" />
      <div>
        <h1>FunASR 语音识别</h1>
        <p class="subtitle">中文语音转写 · 上传或录音即可</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="installBtn" class="install-btn hidden" hidden>安装 App</button>
      <span id="serverBadge" class="server-badge" data-state="unknown">连接中…</span>
    </div>
  </header>

  <main class="container">
    <!-- Audio input card -->
    <section class="card" id="audioCard">
      <div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="选择或拖拽音频文件">
        <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.amr,.aac" hidden />
        <div class="drop-icon">🎙️</div>
        <p class="drop-title">点击选择音频文件</p>
        <p class="drop-hint">或将文件拖拽到此处（wav / mp3 / m4a / ogg / flac 等）</p>
      </div>

      <div class="record-row">
        <button id="recordBtn" class="btn btn-record" disabled>
          <span class="btn-label">开始录音</span>
        </button>
        <span id="recordStatus" class="record-status">需要上传音频</span>
      </div>

      <div id="audioMeta" class="audio-meta hidden"></div>
    </section>

    <!-- Options card -->
    <section class="card">
      <div class="form-grid">
        <label class="field">
          <span class="field-label">模型</span>
          <select id="modelSelect">
            <option value="paraformer" selected>paraformer-zh（中文标点）</option>
            <option value="sensevoice">sensevoice（多语言）</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">语言</span>
          <select id="langSelect">
            <option value="auto" selected>自动检测</option>
            <option value="zh">中文</option>
            <option value="en">英文</option>
            <option value="ja">日文</option>
            <option value="ko">韩文</option>
            <option value="yue">粤语</option>
          </select>
        </label>
      </div>
      <button id="transcribeBtn" class="btn btn-primary" disabled>
        转写文字
      </button>
    </section>

    <!-- Result card -->
    <section class="card result-card hidden" id="resultCard">
      <div class="result-header">
        <h2>转写结果</h2>
        <button id="copyBtn" class="btn btn-ghost">复制</button>
      </div>
      <p id="metrics" class="metrics"></p>
      <pre id="transcript" class="transcript"></pre>
    </section>

    <p class="api-note">
      API：<code id="apiEndpoint">/v1/audio/transcriptions</code> ·
      <a href="https://github.com/modelscope/FunASR" target="_blank" rel="noopener">FunASR</a>
    </p>
  </main>

  <footer class="app-footer">
    <p>FunASR · 由 Cloudflare Tunnel 提供公网访问 · PWA 支持离线缓存与安装</p>
  </footer>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
